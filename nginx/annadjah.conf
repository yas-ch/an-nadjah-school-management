# =============================================================================
# AN-NADJAH — Nginx Configuration
# Place this file at: /etc/nginx/sites-available/annadjah
# Then: sudo ln -s /etc/nginx/sites-available/annadjah /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── HTTP → HTTPS Redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name annadjah.app;

    # Redirect all HTTP to HTTPS (permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name annadjah.app;

    # ── SSL Certificates (install via Certbot) ──────────────────────────
    # sudo certbot --nginx -d annadjah.app
    ssl_certificate     /etc/letsencrypt/live/annadjah.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annadjah.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/annadjah.app/chain.pem;

    # ── SSL Hardening ──────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Diffie-Hellman ──────────────────────────────────────────────────
    # Generate with: sudo openssl dhparam -out /etc/nginx/dhparam.pem 4096
    ssl_dhparam /etc/nginx/dhparam.pem;

    # ── Security Headers ────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Logs ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/annadjah-access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/annadjah-error.log warn;

    # ── Root (for static files and favicon) ─────────────────────────────
    root /var/www/annadjah/public;

    # ── Proxy to Next.js (PM2 on port 3001) ────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ── Next.js Static Assets (cache aggressively) ─────────────────────
    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets on the browser
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Static files (favicon, robots.txt, etc.) ───────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|css|js|pdf)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable";
        expires max;
    }

    # ── Deny access to hidden files ────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny access to sensitive paths ─────────────────────────────────
    location ~ ^/(\.env|\.git|node_modules|prisma|logs|docker) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
